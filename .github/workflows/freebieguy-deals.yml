name: FreebieGuy Daily Deals to Telegram

on:
  schedule:
    # Run daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  send-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet requests

      - name: Restore state cache
        uses: actions/cache@v4
        id: state-cache
        with:
          path: freebieguy_state.json
          key: freebieguy-state-${{ github.run_id }}
          restore-keys: |
            freebieguy-state-

      - name: Run FreebieGuy deals script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: freebieguy_state.json
        run: |
          python send_freebieguy_deals_github.py

      - name: Save state cache
        if: always()
        uses: actions/cache@v4
        with:
          path: freebieguy_state.json
          key: freebieguy-state-${{ github.run_id }}
